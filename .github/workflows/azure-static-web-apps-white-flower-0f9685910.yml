name: Azure Static Web Apps CI/CD (Production)

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true
          lfs: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.PRODUCTION_VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.PRODUCTION_VITE_SUPABASE_ANON_KEY }}

      - name: Run Supabase Migrations (Production)
        run: |
          npx supabase link --project-ref $SUPABASE_PROJECT_REF
          npx supabase db push --include-all
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.PRODUCTION_SUPABASE_PROJECT_REF }}

      # Note: Outlook secrets (MICROSOFT_CLIENT_ID, MICROSOFT_CLIENT_SECRET,
      # OUTLOOK_OAUTH_REDIRECT_URI, APP_BASE_URL) are set manually in
      # Supabase Dashboard → prod project → Edge Functions → Secrets.
      # We only deploy the function code from CI; the secrets persist
      # across deploys.

      - name: Deploy Edge Functions (Production)
        # Deploys only CI-managed functions changed by this push. The checked-in
        # selector owns the complete function list and exact JWT exceptions.
        # Shared-code changes or an unsafe/unknown git diff deploy the full list.
        #
        # NOT deployed by CI — manual `supabase functions deploy` only, so
        # merging changes to these does NOT ship them anywhere:
        #   clickup-services-sync  --no-verify-jwt  (pg_cron caller)
        #   crm-mcp                --no-verify-jwt  (prod-only read-only MCP)
        #   pandadoc-sync          --no-verify-jwt  (PandaDoc webhook)
        # (inbound-lead and nexus-activity both moved INTO this CI list
        #  2026-07-20 for the lead-retirement cutover — see below.)
        # WARNING: clickup-sf-id-sync is live on prod (cron migration
        # 20260429000002 + scripts/migration/clickup-prod-bootstrap*.sql
        # POST to it daily) but its source was never committed to this
        # repo. Before ever redeploying or deleting it, recover the
        # deployed source with:
        #   npx supabase functions download clickup-sf-id-sync \
        #     --project-ref igmwomnkbbsytihtvhbp
        # and commit it under supabase/functions/clickup-sf-id-sync/.
        run: >-
          node scripts/ci/deploy-changed-functions.mjs
          --base "${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}"
          --head "${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.PRODUCTION_SUPABASE_PROJECT_REF }}

      - name: Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_WHITE_FLOWER_0F9685910 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          skip_app_build: true
          app_location: "/dist"
          api_location: ""
          output_location: ""

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_WHITE_FLOWER_0F9685910 }}
          action: "close"
